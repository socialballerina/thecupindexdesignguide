<!DOCTYPE html>

<body>
<x-dc>
<svg viewBox="0 0 200 200" width="100%" height="100%" style="display:block">

    <polygon points="188,100 144,176.2 56,176.2 12,100 56,23.8 144,23.8"></polygon>
    <polygon points="144,100 122,138.1 78,138.1 56,100 78,61.9 122,61.9" strokeOpacity="{{ gridOpacity }}"></polygon>
    <path d="M188 100 L12 100 M144 176.2 L56 23.8 M56 176.2 L144 23.8" strokeOpacity="{{ gridOpacity }}"></path>
  </g>
  <polygon points="179.2,100 127.28,147.25 75.8,141.92 29.6,100 69.2,46.66 137.4,35.22" fill="{{ accent }}" fillOpacity="{{ fillOpacity }}" stroke="{{ accent }}" strokeWidth="{{ sw }}" strokeLinejoin="round"></polygon>
  <circle cx="179.2" cy="100" r="9" fill="{{ accent }}"></circle>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B2A20&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C1622D&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sw&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;fillOpacity&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.16,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;},&quot;gridOpacity&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.34,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
