<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="-92 -46 384 292" width="100%" height="100%" style="display:block;overflow:visible">
  <g fill="none" stroke="{{ ink }}" strokeWidth="{{ sw }}" strokeLinejoin="round">
    <polygon points="188,100 144,176.2 56,176.2 12,100 56,23.8 144,23.8" strokeOpacity="{{ ringOpacity }}"></polygon>
    <polygon points="158.7,100 129.3,150.8 70.7,150.8 41.3,100 70.7,49.2 129.3,49.2" strokeOpacity="{{ gridOpacity }}"></polygon>
    <polygon points="129.3,100 114.7,125.4 85.3,125.4 70.7,100 85.3,74.6 114.7,74.6" strokeOpacity="{{ gridOpacity }}"></polygon>
    <path d="M188 100 L12 100 M144 176.2 L56 23.8 M56 176.2 L144 23.8" strokeOpacity="{{ gridOpacity }}"></path>
  </g>
  <polygon points="{{ dataPoints }}" fill="{{ accent }}" fillOpacity="{{ fillOpacity }}" stroke="{{ accent }}" strokeWidth="{{ sw }}" strokeLinejoin="round"></polygon>
  <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="6">
    <circle cx="{{ n.x }}" cy="{{ n.y }}" r="{{ dotR }}" fill="{{ accent }}"></circle>
  </sc-for>
  {{ labelNodes }}
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:320},&quot;latte&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;vibe&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:9,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;food&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;location&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;repeat&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#964B34&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D9A03C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sw&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.4,&quot;min&quot;:1,&quot;max&quot;:8,&quot;step&quot;:0.2,&quot;tsType&quot;:&quot;number&quot;},&quot;labelSize&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:11,&quot;min&quot;:6,&quot;max&quot;:30,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;valueSize&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:15,&quot;min&quot;:6,&quot;max&quot;:40,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;dotR&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;fillOpacity&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.22,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;},&quot;gridOpacity&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.28,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;},&quot;ringOpacity&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const axes = [
      { key: 'latte', name: 'Latte', deg: 0 },
      { key: 'vibe', name: 'Vibe', deg: -60 },
      { key: 'food', name: 'Food', deg: -120 },
      { key: 'price', name: 'Price', deg: 180 },
      { key: 'location', name: 'Location', deg: 120 },
      { key: 'repeat', name: 'Repeatability', deg: 60 }
    ];
    const R = 88, cx = 100, cy = 100;
    const showLabels = p.showLabels !== false;
    const nodes = [], labels = [];
    axes.forEach(a => {
      const v = Number(p[a.key] ?? 0);
      const rad = a.deg * Math.PI / 180;
      const ux = Math.cos(rad), uy = Math.sin(rad);
      const r = R * Math.min(v, 10) / 10;
      nodes.push({ x: +(cx + ux * r).toFixed(2), y: +(cy + uy * r).toFixed(2) });
      const lr = R + 26;
      const lx = cx + ux * lr, ly = cy + uy * lr;
      const anchor = Math.abs(ux) < 0.2 ? 'middle' : (ux > 0 ? 'start' : 'end');
      labels.push({
        name: a.name, value: v.toFixed(1),
        x: +lx.toFixed(1), y: +(ly + (uy < -0.2 ? -6 : uy > 0.2 ? 12 : 0)).toFixed(1),
        vx: +lx.toFixed(1), vy: +(ly + (uy < -0.2 ? -6 : uy > 0.2 ? 12 : 0) + (p.valueGap ?? 20)).toFixed(1),
        anchor
      });
    });
    return {
      ink: p.ink ?? '#964B34',
      accent: p.accent ?? '#D9A03C',
      sw: p.sw ?? 2.4,
      dotR: p.dotR ?? 5,
      fillOpacity: p.fillOpacity ?? 0.22,
      gridOpacity: p.gridOpacity ?? 0.28,
      ringOpacity: p.ringOpacity ?? 0.6,
      labelSize: p.labelSize ?? 11,
      valueSize: p.valueSize ?? 15,
      nodes,
      labelNodes: showLabels ? labels.flatMap((l, i) => [
        React.createElement('text', {
          key: 'n' + i, x: l.x, y: l.y, textAnchor: l.anchor, fill: p.ink ?? '#964B34',
          fontFamily: 'Saira, sans-serif', fontSize: p.labelSize ?? 11, fontWeight: 500,
          letterSpacing: '0.5px'
        }, l.name),
        React.createElement('text', {
          key: 'v' + i, x: l.vx, y: l.vy, textAnchor: l.anchor, fill: p.accent ?? '#D9A03C',
          fontFamily: 'Saira, sans-serif', fontSize: p.valueSize ?? 15, fontWeight: 600
        }, l.value)
      ]) : null,
      dataPoints: nodes.map(n => n.x + ',' + n.y).join(' ')
    };
  }
}
</script>
</body>
</html>
