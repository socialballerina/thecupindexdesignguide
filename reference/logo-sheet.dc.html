<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #DCCB9F; }
    a { color: #D9A03C; text-decoration: none; }
    a:hover { color: #F1E7C4; }
  </style>
</helmet>

<div style="width:1200px;margin:0 auto;padding:56px 56px 88px;background:#F1E7C4;color:#964B34;font-family:Satoshi,sans-serif;display:flex;flex-direction:column;gap:36px">

  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid rgba(150,75,52,0.3);padding-bottom:16px">
    <div style="font-family:Saira,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.34em;text-transform:uppercase">The Cup Index / Final logo</div>
    <div style="font-family:Saira,sans-serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.7">Chestnut #964B34 · Vanilla #F1E7C4 · Deep honey #D9A03C</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
    <div style="aspect-ratio:1/1;background:#964B34;display:flex;align-items:center;justify-content:center;padding:14%">
      <dc-import name="LogoLockup" layout="stacked" size="104" ink="#F1E7C4" accent="#D9A03C" gsw="5" hint-size="340px,230px"></dc-import>
    </div>
    <div style="aspect-ratio:1/1;background:#F1E7C4;border:1px solid rgba(150,75,52,0.28);display:flex;align-items:center;justify-content:center;padding:14%">
      <dc-import name="LogoLockup" layout="stacked" size="104" ink="#964B34" accent="#D9A03C" gsw="5" hint-size="340px,230px"></dc-import>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
    <div style="background:#964B34;display:flex;align-items:center;justify-content:center;padding:56px 40px">
      <dc-import name="LogoLockup" layout="horizontal" size="52" ink="#F1E7C4" accent="#D9A03C" gsw="5.5" hint-size="320px,64px"></dc-import>
    </div>
    <div style="background:#F1E7C4;border:1px solid rgba(150,75,52,0.28);display:flex;align-items:center;justify-content:center;padding:56px 40px">
      <dc-import name="LogoLockup" layout="horizontal" size="52" ink="#964B34" accent="#D9A03C" gsw="5.5" hint-size="320px,64px"></dc-import>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:22px">
    <div style="aspect-ratio:1/1;background:#964B34;display:flex;align-items:center;justify-content:center;padding:22%">
      <dc-import name="RadarMark" ink="#F1E7C4" accent="#D9A03C" sw="4" fillOpacity="0.2" gridOpacity="0.3" hint-size="100%,100%"></dc-import>
    </div>
    <div style="aspect-ratio:1/1;background:#F1E7C4;border:1px solid rgba(150,75,52,0.28);display:flex;align-items:center;justify-content:center;padding:22%">
      <dc-import name="RadarMark" ink="#964B34" accent="#D9A03C" sw="4" fillOpacity="0.2" gridOpacity="0.3" hint-size="100%,100%"></dc-import>
    </div>
    <div style="aspect-ratio:1/1;background:#D9A03C;display:flex;align-items:center;justify-content:center;padding:22%">
      <dc-import name="RadarMark" ink="#964B34" accent="#964B34" sw="4" fillOpacity="0.14" gridOpacity="0.3" hint-size="100%,100%"></dc-import>
    </div>
    <div style="aspect-ratio:1/1;background:#000000;display:flex;align-items:center;justify-content:center;padding:22%">
      <dc-import name="RadarMark" ink="#FFFFFF" accent="#FFFFFF" sw="4" fillOpacity="0.14" gridOpacity="0.3" hint-size="100%,100%"></dc-import>
    </div>
    <div style="aspect-ratio:1/1;background:#FFFFFF;border:1px solid rgba(0,0,0,0.16);display:flex;align-items:center;justify-content:center;padding:22%">
      <dc-import name="RadarMark" ink="#000000" accent="#000000" sw="4" fillOpacity="0.1" gridOpacity="0.3" hint-size="100%,100%"></dc-import>
    </div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:28px">
    <div style="width:132px;height:132px;border-radius:50%;background:#964B34;display:flex;align-items:center;justify-content:center;padding:26px;box-sizing:border-box">
      <dc-import name="RadarMark" ink="#F1E7C4" accent="#D9A03C" sw="5" fillOpacity="0.22" gridOpacity="0.28" hint-size="100%,100%"></dc-import>
    </div>
    <div style="width:88px;height:88px;background:#964B34;display:flex;align-items:center;justify-content:center;padding:14px">
      <dc-import name="RadarMark" ink="#F1E7C4" accent="#D9A03C" sw="5" fillOpacity="0.2" gridOpacity="0.2" hint-size="100%,100%"></dc-import>
    </div>
    <div style="width:44px;height:44px;background:#964B34;display:flex;align-items:center;justify-content:center;padding:7px">
      <dc-import name="RadarMark" ink="#F1E7C4" accent="#D9A03C" sw="6" fillOpacity="0.18" gridOpacity="0" hint-size="100%,100%"></dc-import>
    </div>
    <div style="width:32px;height:32px;background:#964B34;display:flex;align-items:center;justify-content:center;padding:5px">
      <dc-import name="RadarMark" ink="#F1E7C4" accent="#D9A03C" sw="7" fillOpacity="0.18" gridOpacity="0" hint-size="100%,100%"></dc-import>
    </div>
    <div style="font-family:Saira,sans-serif;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.7;padding-bottom:4px">Avatar · 88 · 44 · 32 px</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}"></script>
</body>
</html>
